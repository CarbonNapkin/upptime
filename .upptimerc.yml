owner: CarbonNapkin
repo: upptime
# icon: shown on each status card and in the README table. Upptime's default
# is DuckDuckGo's favicon service for the URL's host, which has nothing for
# api.carbonnapkin.com or the smaller brand domains and renders a generic
# chevron. Brand sites use their own favicon.svg; API sub-services carry the
# vendor they front (Supabase, Stripe, carriers...) so a red card says at a
# glance whose outage it is; in-house pieces wear the CarbonNapkin mark.
#
# name prefix "Container:" = one of the droplet's application containers in
# api/docker-compose.yml (flask-main, puppeteer, step-sidecar). Crons is NOT
# one: the host crontab runs every job via `docker exec flask-main`, so it
# watches the schedule, not a container. flask-worker is the fourth app
# container and has no health signal yet.
# slug: pinned on renamed entries so history/<slug>.yml and graphs/<slug>/
# keep accruing instead of restarting under a new slugified name.
#
# ORDER MATTERS. The status page renders tiles as plain siblings in this
# order, so the group headers below are pure CSS keyed on tile position
# (article:nth-child(N) for N in the "tile N" markers). Adding, removing or
# moving an entry shifts the indexes: update the nth-child numbers in
# status-website.css in the same commit.
sites:
  # ── Storefronts ── (tile 1; the CSS group header keys off this index)
  - name: CarbonNapkin
    url: https://carbonnapkin.com/health
    icon: https://carbonnapkin.com/favicon.svg
  - name: Great Lakes Shafts
    url: https://greatlakesshafts.com/health
    icon: https://greatlakesshafts.com/favicon.svg
  # Launched 2026-09-14 (cn#1016 un-parked prod). Same caveat as every
  # storefront: /health is exempt from the maintenance flag, so this reads
  # 'up' while a parked brand serves its holding page — which is why Lake
  # Superior Fasteners is NOT here until it relaunches (#85).
  - name: LakerPrints
    url: https://lakerprints.com/health
    icon: https://lakerprints.com/favicon.svg
  - name: Portal
    url: https://portal.carbonnapkin.com/health
    icon: https://carbonnapkin.com/favicon.svg
  # ── Droplet ── (tile 5; the CSS group header keys off this index)
  - name: 'Container: API'
    slug: api
    url: https://api.carbonnapkin.com/health
    icon: https://carbonnapkin.com/favicon.svg
  - name: 'Container: Render'
    slug: render
    url: https://api.carbonnapkin.com/health/render
    icon: https://carbonnapkin.com/favicon.svg
  # OCCT STEP sidecar. Async + low-volume by design, so a dead sidecar
  # degrades STEP generation without ever failing an order — silent, which
  # is the whole reason it needs an external monitor.
  - name: 'Container: STEP Sidecar'
    slug: step-sidecar
    url: https://api.carbonnapkin.com/health/step
    icon: https://carbonnapkin.com/favicon.svg
  - name: Crons
    slug: crons
    url: https://api.carbonnapkin.com/health/crons
    icon: https://carbonnapkin.com/favicon.svg
  - name: Droplet
    url: https://api.carbonnapkin.com/health/droplet
    icon: https://icons.duckduckgo.com/ip3/digitalocean.com.ico
  # ── Platform ── (tile 10; the CSS group header keys off this index)
  - name: Database
    url: https://api.carbonnapkin.com/health/db
    icon: https://icons.duckduckgo.com/ip3/supabase.com.ico
  # Supabase Auth (GoTrue). Sits next to Database because they're the pair
  # that mean "nobody can use the site" — Postgres being up is no comfort if
  # logins can't be verified. Route added in cn#772; the probe behind it had
  # been running in cron.dependency_health for months with no public signal.
  - name: Auth
    url: https://api.carbonnapkin.com/health/auth
    icon: https://icons.duckduckgo.com/ip3/supabase.com.ico
  # Cloudflare R2: uploads, order photos, BOLs, CAD files, PDF renders.
  # Nothing probed it until cn 7dde8bd8 (2026-10-29); a rotated token would
  # have shown up as the first customer's failed upload. Route cn#1464.
  - name: Storage
    url: https://api.carbonnapkin.com/health/storage
    icon: https://icons.duckduckgo.com/ip3/cloudflare.com.ico
  # The CF Browser Rendering reserve pipeline. A back-pocket engine nobody
  # exercises is exactly the thing that rots unnoticed, so it gets watched
  # like a live one. Caveat: when DRAWING_RENDER_URL is unset the route
  # answers 200 'not_configured' — this catches a dead Worker, NOT an
  # un-wired reserve. Check the bundleHash in the body for drift.
  - name: Render Reserve
    url: https://api.carbonnapkin.com/health/render/cf
    icon: https://icons.duckduckgo.com/ip3/cloudflare.com.ico
  # ── Integrations ── (tile 14; the CSS group header keys off this index)
  - name: Payments
    url: https://api.carbonnapkin.com/health/payments
    icon: https://icons.duckduckgo.com/ip3/stripe.com.ico
  # Mercury is the partner-payout money-out path. Nothing else touches the
  # token between payouts, so this probe is the only continuous signal that
  # a payout *could* be sent. Route added in cn 5a964074 (2026-08-21).
  - name: Mercury
    url: https://api.carbonnapkin.com/health/mercury
    icon: https://icons.duckduckgo.com/ip3/mercury.com.ico
  - name: FedEx
    url: https://api.carbonnapkin.com/health/fedex
    icon: https://icons.duckduckgo.com/ip3/fedex.com.ico
  - name: UPS
    url: https://api.carbonnapkin.com/health/ups
    icon: https://icons.duckduckgo.com/ip3/ups.com.ico
  # The carrier that actually ships. The probe behind this also checks the
  # token's GRANTED scopes — USPS hands back a 200 token with revoked scopes
  # silently stripped (2026-08-15: labels 401'd while rates worked), so a
  # scope regression reads down here instead of mid-shipment. Probed in
  # cron.dependency_health since 2026-08-22; public route cn#1464.
  - name: USPS
    url: https://api.carbonnapkin.com/health/usps
    icon: https://icons.duckduckgo.com/ip3/usps.com.ico
  - name: Email
    url: https://api.carbonnapkin.com/health/email
    icon: https://icons.duckduckgo.com/ip3/resend.com.ico
  - name: HubSpot
    url: https://api.carbonnapkin.com/health/hubspot
    icon: https://icons.duckduckgo.com/ip3/hubspot.com.ico
  # Re-added 2026-08-15. Dropped 2026-04-14 when every idle access token
  # read as an outage; probe_qbo was rewritten 2026-05-15 and now reports
  # down only when the *refresh* token is stale (reauth genuinely required)
  # — a merely-expired access token is self-healing and reports healthy.
  # If this flaps again, the probe is the thing to fix, not this entry.
  - name: QuickBooks
    url: https://api.carbonnapkin.com/health/qbo
    icon: https://icons.duckduckgo.com/ip3/quickbooks.intuit.com.ico
notifications:
  # Slack alerts on site/service degradation. The Upptime workflow reads
  # the webhook URL from the NOTIFICATION_SLACK_WEBHOOK_URL repo secret —
  # not from this file — so the URL never sits in git.
  #
  # Routed to the same channel as the API's send_critical_error /
  # send_pipeline_failure / send_dispute_alert pings. One-person ops:
  # consolidating signals beats splitting them across channels.
  - type: slack
    channel: '#ops-alerts'
status-website:
  cname: status.carbonnapkin.com
  logoUrl: https://carbonnapkin.com/favicon.svg
  name: CarbonNapkin Status
  theme: dark
  # Two halves. First: the dark-navy palette (theme vars + link/footer
  # colours). Second, from .container onward: the Live Status grid — three
  # columns at ≥1024px, two to 760px, one below; content column widened
  # 800→1040px; sparkline pinned to the right 100px of each card; labels on
  # one line. Group headers are nth-child rules keyed on the "tile N" markers
  # in sites: above — each group start gets grid-column-start:1 (new row),
  # an uppercase ::before label, and top margin on that whole row (how many
  # tiles share the row depends on the column count, hence the breakpoints).
  # Scoped to section.live-status so incident cards keep the stock layout.
  css: ":root{--body-background-color:#1a2e44;--body-text-color:#c4d1dc;--card-background-color:#243b53;--card-border-color:#3d5a73;--nav-background-color:#243b53;--nav-border-bottom-color:#3d5a73;--nav-text-color:#c4d1dc;--up-color:#4ade80;--up-background-color:rgba(74,222,128,0.1);--up-border-left-color:#4ade80;--down-color:#ef4444;--down-background-color:rgba(239,68,68,0.15);--down-border-left-color:#ef4444;--degraded-color:#fbbf24;--degraded-background-color:rgba(251,191,36,0.15);--degraded-border-left-color:#fbbf24;--link-color:#6a9ab8;--link-hover-color:#8ab5cf}a{color:#6a9ab8}a:hover{color:#8ab5cf}footer{color:#6a9ab8}.container{max-width:1040px}section.live-status{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}@media(max-width:1023px){section.live-status{grid-template-columns:repeat(2,1fr)}}@media(max-width:759px){section.live-status{grid-template-columns:1fr}}section.live-status article{margin-top:0;padding:.7rem 7.5rem .7rem 1rem;position:relative}section.live-status article.graph{background-size:auto 72%;background-position:right .6rem center}section.live-status h4{margin-bottom:.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}section.live-status article div{font-size:.82rem;opacity:.85;line-height:1.35;white-space:nowrap}section.live-status article:nth-child(5),section.live-status article:nth-child(10),section.live-status article:nth-child(14){grid-column-start:1}section.live-status article:nth-child(1)::before,section.live-status article:nth-child(5)::before,section.live-status article:nth-child(10)::before,section.live-status article:nth-child(14)::before{position:absolute;top:-1.45rem;left:.1rem;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--link-color)}section.live-status article:nth-child(1)::before{content:'Storefronts'}section.live-status article:nth-child(5)::before{content:'Droplet'}section.live-status article:nth-child(10)::before{content:'Platform'}section.live-status article:nth-child(14)::before{content:'Integrations'}section.live-status article:nth-child(1),section.live-status article:nth-child(5),section.live-status article:nth-child(10),section.live-status article:nth-child(14){margin-top:1.7rem}@media(min-width:760px){section.live-status article:nth-child(2),section.live-status article:nth-child(6),section.live-status article:nth-child(11),section.live-status article:nth-child(15){margin-top:1.7rem}}@media(min-width:1024px){section.live-status article:nth-child(3),section.live-status article:nth-child(7),section.live-status article:nth-child(12),section.live-status article:nth-child(16){margin-top:1.7rem}}"
  favicon: https://carbonnapkin.com/favicon.svg
# Shorter card labels so three columns fit without wrapping. Same strings
# show on the per-service history pages.
i18n:
  overallUptime: "Uptime: $UPTIME"
  averageResponseTime: "Response time: $TIME ms"
workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  uptime: "*/5 * * * *"
